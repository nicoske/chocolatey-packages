name: Update Chocolatey Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Packages to rebuild and push again, comma separated, with an optional version (example: tomcat10:10.1.59)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chocolatey-AU
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Chocolatey-AU -Force -Scope CurrentUser

      - name: Find versions missing on chocolatey.org
        id: missing
        shell: pwsh
        run: |
          # A version committed to the repo but absent from chocolatey.org means a push failed:
          # rebuild it with the same version so it gets pushed again.
          $missing = foreach ($nuspec in Get-ChildItem -Path automatic -Filter *.nuspec -Recurse) {
            $metadata = ([xml](Get-Content $nuspec.FullName)).package.metadata
            $url = "https://community.chocolatey.org/api/v2/Packages(Id='$($metadata.id)',Version='$($metadata.version)')"
            try {
              Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing | Out-Null
            } catch {
              Write-Host "$($metadata.id) $($metadata.version) is not on chocolatey.org"
              "$($metadata.id):$($metadata.version)"
            }
          }
          "packages=$($missing -join ',')" >> $env:GITHUB_OUTPUT

      - name: Run update script
        shell: pwsh
        env:
          au_Push: 'false'
          github_user_repo: ${{ github.repository }}
          github_api_key: ${{ github.token }}
          gist_id: ${{ secrets.GIST_ID }}
          forced_packages: ${{ format('{0},{1}', github.event.inputs.force, steps.missing.outputs.packages) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $forced = $env:forced_packages -split ',' | Where-Object { $_ }
          ./update_all.ps1 "tomcat*" -ForcedPackages $forced

      - name: Commit and push changes
        if: always()
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "Automatic package update"
            git push
          } else {
            Write-Host "No changes to commit"
          }

      - name: Push packages to Chocolatey
        if: always()
        shell: pwsh
        env:
          ChocolateyApiKey: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkgs = Get-ChildItem -Path automatic -Filter *.nupkg -Recurse
          if (-not $nupkgs) {
            Write-Host "No packages to push"
            return
          }
          foreach ($nupkg in $nupkgs) {
            Write-Host "Pushing $($nupkg.Name)"
            choco push $nupkg.FullName --source="https://push.chocolatey.org/" --api-key=$env:ChocolateyApiKey
            if ($LastExitCode -ne 0) { throw "choco push failed for $($nupkg.Name)" }
          }
