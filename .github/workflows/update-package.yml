name: Update Chocolatey Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chocolatey-AU
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Chocolatey-AU -Force -Scope CurrentUser

      - name: Run update script
        shell: pwsh
        env:
          au_Push: 'false'
          github_user_repo: ${{ github.repository }}
          github_api_key: ${{ github.token }}
          gist_id: ${{ secrets.GIST_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./update_all.ps1 "tomcat*"

      - name: Commit and push changes
        if: always()
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "Automatic package update"
            git push
          } else {
            Write-Host "No changes to commit"
          }

      - name: Push packages to Chocolatey
        if: always()
        shell: pwsh
        env:
          ChocolateyApiKey: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkgs = Get-ChildItem -Path automatic -Filter *.nupkg -Recurse
          if (-not $nupkgs) {
            Write-Host "No packages to push"
            return
          }
          foreach ($nupkg in $nupkgs) {
            Write-Host "Pushing $($nupkg.Name)"
            choco push $nupkg.FullName --source="https://push.chocolatey.org/" --api-key=$env:ChocolateyApiKey
            if ($LastExitCode -ne 0) { throw "choco push failed for $($nupkg.Name)" }
          }
